<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <link rel="script" href="./script.js">
    <title>Javascript</title>
</head>

<body>

    <input id="campo1" type="text">
    <input id="campo2" type="text">
    <button onclick="soma()">+</button>
    <button onclick="subitracao()">-</button>
    <button onclick="divisao()">/</button>
    <button onclick="multiplicacao()">*</button>
    <p id="resultado">resultado</p>


    <script>
        function soma() {
            var pagina = document;

            var campo1 = pagina.getElementById('campo1');
            var campo2 = pagina.getElementById('campo2');
            var resultado = pagina.getElementById('resultado');

            if (!Number(campo1.value)) {
                resultado.innerHTML = 'O campo 1 não é um número';
                campo1.classList.add('erro')
            } else if (!Number(campo2.value)) {
                resultado.innerHTML = 'O campo 2 não é um número';
            } else {
                resultado.innerHTML = 'A soma dos dois valores é : ' + (Number(campo1.value) + Number(campo2.value)).toFixed(2);
            }

        }

        function subitracao() {
            var pagina = document;

            var campo1 = pagina.getElementById('campo1').value;
            var campo2 = pagina.getElementById('campo2').value;
            var resultado = pagina.getElementById('resultado');

            if (!Number(campo1)) {
                resultado.innerHTML = 'O campo 1 não é um número';
            } else if (!Number(campo2)) {
                resultado.innerHTML = 'O campo 2 não é um número';
            } else {
                resultado.innerHTML = 'A soma dos dois valores é : ' + (Number(campo1) - Number(campo2)).toFixed(2);
            }
        }

        function divisao() {
            var pagina = document;

            var campo1 = pagina.getElementById('campo1').value;
            var campo2 = pagina.getElementById('campo2').value;
            var resultado = pagina.getElementById('resultado');

            if (!Number(campo1)) {
                resultado.innerHTML = 'O campo 1 não é um número';
            } else if (!Number(campo2)) {
                resultado.innerHTML = 'O campo 2 não é um número';
            } else {
                resultado.innerHTML = 'A soma dos dois valores é : ' + (Number(campo1) / Number(campo2)).toFixed(2);
            }
        }

        function multiplicacao() {
            var pagina = document;

            var campo1 = pagina.getElementById('campo1').value;
            var campo2 = pagina.getElementById('campo2').value;
            var resultado = pagina.getElementById('resultado');

            if (!Number(campo1)) {
                resultado.innerHTML = 'O campo 1 não é um número';
            } else if (!Number(campo2)) {
                resultado.innerHTML = 'O campo 2 não é um número';
            } else {
                resultado.innerHTML = 'A soma dos dois valores é : ' + (Number(campo1) * Number(campo2)).toFixed(2);
            }
        }


    </script>


    <style>
        .erro {
            border: 1px solid red;
        }
    </style>

</body>

</html>
